name: Ownership regression

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  ownership:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Actual-source SDK boundary regressions
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/test_ownership.py
